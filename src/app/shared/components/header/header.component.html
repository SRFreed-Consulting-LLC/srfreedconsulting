<header class="topbar">
  <div class="topbar__wrap">
    <a class="wordmark" routerLink="/home">SRFreed Consulting</a>

    <nav class="nav" id="site-nav" aria-label="Site" [class.nav--open]="menuOpen()">
      <ul class="nav__list">
        <li *ngFor="let item of items">
          <a
            class="nav__link"
            [routerLink]="item.path"
            routerLinkActive="nav__link--active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()">{{ item.text }}</a>
        </li>
      </ul>
    </nav>

    <button
      type="button"
      class="topbar__menu"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
      (click)="toggleMenu()">Menu</button>

    <a class="btn btn--primary btn--small topbar__cta" href="mailto:shane.freed@srfreedconsulting.com">
      Contact Me
    </a>
  </div>
</header>
